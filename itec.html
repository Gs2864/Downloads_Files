<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Central de Downloads</title>

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css">

    <link rel="stylesheet" href="pg_inicial.css">
</head>

<body>

    <header>
        <h1>
            <i class="bi bi-cloud-arrow-down-fill"></i>
            Central de Downloads
        </h1>
    </header>

    <main>

        <h2>Central de Downloads</h2>

        <p>
            Selecione uma categoria para acessar os arquivos.
        </p>

        <div class="categorias">

            <div class="button-borders">
                <button class="primary-button"
                        onclick="abrirPagina('itec.html')">
                    <span>
                        <i class="bi bi-pc-display"></i>
                        ITEC
                    </span>
                </button>
            </div>

            <div class="button-borders">
                <button class="primary-button"
                        onclick="emDesenvolvimento()">
                    <span>
                        <i class="bi bi-box-seam"></i>
                        SFW
                    </span>
                </button>
            </div>

            <div class="button-borders">
                <button class="primary-button"
                        onclick="emDesenvolvimento()">
                    <span>
                        <i class="bi bi-printer"></i>
                        DRIVERS
                    </span>
                </button>
            </div>

            <div class="button-borders">
                <button class="primary-button"
                        onclick="emDesenvolvimento()">
                    <span>
                        <i class="bi bi-journal-text"></i>
                        MANUAIS
                    </span>
                </button>
            </div>

            <div class="button-borders">
                <button class="primary-button"
                        onclick="emDesenvolvimento()">
                    <span>
                        <i class="bi bi-tools"></i>
                        UTILITÁRIOS
                    </span>
                </button>
            </div>

            <div class="button-borders">
                <button class="primary-button"
                        onclick="emDesenvolvimento()">
                    <span>
                        <i class="bi bi-android2"></i>
                        ANDROID
                    </span>
                </button>
            </div>

            <div class="button-borders">
                <button class="primary-button"
                        onclick="emDesenvolvimento()">
                    <span>
                        <i class="bi bi-windows"></i>
                        WINDOWS
                    </span>
                </button>
            </div>

            <div class="button-borders">
                <button class="primary-button"
                        onclick="emDesenvolvimento()">
                    <span>
                        <i class="bi bi-plus-circle"></i>
                        MAIS
                    </span>
                </button>
            </div>

        </div>

    </main>

    <footer>
        © 2026 - Central de Downloads
    </footer>

    <script src="pg_inicial.js"></script>

</body>

</html>

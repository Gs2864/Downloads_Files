<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central de Downloads - PDV</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background: #f4f6f9;
        }

        .navbar {
            box-shadow: 0 2px 8px rgba(0, 0, 0, .15);
        }

        .card {
            border: none;
            border-radius: 15px;
        }

        .table td,
        .table th {
            vertical-align: middle;
        }

        .icone {
            font-size: 28px;
            color: #0d6efd;
        }

        footer {
            margin-top: 40px;
            padding: 20px;
            background: #212529;
            color: white;
        }
    </style>

</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">

            <a class="navbar-brand" href="#">
                <i class="bi bi-cloud-arrow-down-fill"></i>
                Central de Downloads
            </a>

            <a href="../index.html" class="btn btn-light">
                <i class="bi bi-house"></i>
                Início
            </a>

        </div>
    </nav>

    <div class="container mt-5">

        <div class="card shadow">

            <div class="card-header bg-primary text-white">

                <h4 class="mb-0">
                    <i class="bi bi-pc-display"></i>
                    Downloads - Sistema PDV
                </h4>

            </div>

            <div class="card-body">

                <input type="text" id="pesquisa" class="form-control mb-4" placeholder="Pesquisar arquivo..."
                    onkeyup="pesquisar()">

                <table class="table table-hover" id="tabela">

                    <thead class="table-light">

                        <tr>
                            <th>Arquivo</th>
                            <th>Descrição</th>
                            <th>Versão</th>
                            <th>Tamanho</th>
                            <th class="text-center">Download</th>
                        </tr>

                    </thead>

                    <tbody>

                        <tr>

                            <td>
                                <i class="bi bi-file-earmark-arrow-down icone"></i>
                                SistemaPDV.exe
                            </td>

                            <td>Instalador completo do PDV</td>

                            <td>2.5.0</td>

                            <td>120 MB</td>

                            <td class="text-center">

                                <a href="../downloads/pdv/SistemaPDV.exe" class="btn btn-success">

                                    <i class="bi bi-download"></i>
                                    Baixar

                                </a>

                            </td>

                        </tr>

                        <tr>

                            <td>
                                <i class="bi bi-arrow-repeat icone"></i>
                                Atualizacao.exe
                            </td>

                            <td>Atualização do sistema</td>

                            <td>2.5.1</td>

                            <td>25 MB</td>

                            <td class="text-center">

                                <a href="../downloads/pdv/Atualizacao.exe" class="btn btn-primary">

                                    <i class="bi bi-download"></i>
                                    Baixar

                                </a>

                            </td>

                        </tr>

                        <tr>

                            <td>
                                <i class="bi bi-file-earmark-pdf icone text-danger"></i>
                                Manual.pdf
                            </td>

                            <td>Manual de utilização</td>

                            <td>2026</td>

                            <td>3 MB</td>

                            <td class="text-center">

                                <a href="../downloads/pdv/Manual.pdf" class="btn btn-danger">

                                    <i class="bi bi-download"></i>
                                    Baixar

                                </a>

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

    <footer class="text-center">

        © 2026 - Central de Downloads

    </footer>

    <script>

        function pesquisar() {

            let filtro = document.getElementById("pesquisa").value.toUpperCase();

            let tabela = document.getElementById("tabela");

            let tr = tabela.getElementsByTagName("tr");

            for (let i = 1; i < tr.length; i++) {

                let texto = tr[i].textContent || tr[i].innerText;

                if (texto.toUpperCase().indexOf(filtro) > -1) {

                    tr[i].style.display = "";

                } else {

                    tr[i].style.display = "none";

                }

            }

        }

    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>

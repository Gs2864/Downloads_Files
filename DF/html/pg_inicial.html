<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Central de Downloads</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">

        <div class="container">

            <a class="navbar-brand fw-bold" href="#">

                <i class="bi bi-cloud-arrow-down-fill"></i>

                Central de Downloads

            </a>

        </div>

    </nav>

    <div class="container py-5">

        <div class="text-center mb-5">

            <h1 class="fw-bold">Central de Downloads</h1>

            <p class="text-muted">
                Selecione uma categoria para acessar os arquivos disponíveis.
            </p>

        </div>

        <div class="row g-4">

            <!-- ITEC -->
            <div class="col-lg-3 col-md-4 col-sm-6">

                <button class="categoria" onclick="abrirPagina('itec.html')">

                    <i class="bi bi-pc-display categoria-icon"></i>

                    <h5>ITEC</h5>

                    <small>Sistemas ITEC</small>

                </button>

            </div>

            <!-- SFW -->
            <div class="col-lg-3 col-md-4 col-sm-6">

                <button class="categoria" onclick="abrirPagina('sfw.html')">

                    <i class="bi bi-box-seam categoria-icon"></i>

                    <h5>SFW</h5>

                    <small>Programas</small>

                </button>

            </div>

            <!-- Drivers -->
            <div class="col-lg-3 col-md-4 col-sm-6">

                <button class="categoria" onclick="abrirPagina('printers.html')">

                    <i class="bi bi-printer categoria-icon"></i>

                    <h5>Drivers</h5>

                    <small>Periféricos</small>

                </button>

            </div>

            <!-- Manuais -->
            <div class="col-lg-3 col-md-4 col-sm-6">

                <button class="categoria" onclick="abrirPagina('manuais.html')">

                    <i class="bi bi-journal-text categoria-icon"></i>

                    <h5>Manuais</h5>

                    <small>Documentação</small>

                </button>

            </div>

            <!-- Utilitários -->
            <div class="col-lg-3 col-md-4 col-sm-6">

                <button class="categoria" onclick="abrirPagina('utilitarios.html')">

                    <i class="bi bi-tools categoria-icon"></i>

                    <h5>Utilitários</h5>

                    <small>Ferramentas</small>

                </button>

            </div>

            <!-- Android -->
            <div class="col-lg-3 col-md-4 col-sm-6">

                <button class="categoria" onclick="abrirPagina('android.html')">

                    <i class="bi bi-android2 categoria-icon"></i>

                    <h5>Android</h5>

                    <small>APK's</small>

                </button>

            </div>

            <!-- Windows -->
            <div class="col-lg-3 col-md-4 col-sm-6">

                <button class="categoria" onclick="abrirPagina('windows.html')">

                    <i class="bi bi-windows categoria-icon"></i>

                    <h5>Windows</h5>

                    <small>Aplicativos</small>

                </button>

            </div>

            <!-- Em desenvolvimento -->
            <div class="col-lg-3 col-md-4 col-sm-6">

                <button class="categoria" onclick="emDesenvolvimento()">

                    <i class="bi bi-plus-circle categoria-icon"></i>

                    <h5>Mais</h5>

                    <small>Em desenvolvimento</small>

                </button>

            </div>

        </div>

    </div>

    <footer class="bg-dark text-white text-center p-3 mt-5">

        © 2026 - Central de Downloads

    </footer>

    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
